[project]
name = "git-cicd-demo"
version = "0.1.0"
description = "Experiment 2: Git, GitHub and CI/CD for a small Python ML helper"
readme = "README.md"
authors = [
    { name = "Gaurang Gupta", email = "gaurangrgupta@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

